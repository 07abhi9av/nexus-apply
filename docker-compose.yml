version: '3.8'

services:
  ingress-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ingress-compute-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingress-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ingress-web-client
    ports:
      - "5180:5180"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      ingress-backend:
        condition: service_healthy
    restart: unless-stopped
